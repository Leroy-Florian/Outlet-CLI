name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  dotnet:
    name: .NET — build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Outlet.slnx

      - name: Build (Release, 0 warning)
        run: dotnet build Outlet.slnx -c Release --no-restore

      # Lane PR : hermétique, rapide, sans secret. Les tests "Live"
      # (providers réels) appartiennent à une lane planifiée non bloquante ;
      # les tests "E2E" (CLI réelle bout-en-bout × OS) vivent dans e2e.yml.
      - name: Test
        run: dotnet test Outlet.slnx -c Release --no-build --filter "Category!=Live&Category!=E2E"

      # Gate de qualité : la barre du CLAUDE.md (>= 90% de lignes sur Domain+Application)
      # est désormais APPLIQUÉE, pas seulement affirmée. Le filtre d'assemblies vit dans
      # coverage.runsettings ; Infrastructure/Cli sont testés en intégration, pas line-gated.
      - name: Coverage gate (Domain + Application >= 90%)
        run: |
          dotnet test tests/Outlet.Core.UnitTests/Outlet.Core.UnitTests.csproj -c Release --no-build \
            --collect:"XPlat Code Coverage" --settings coverage.runsettings --results-directory ./coverage
          file=$(find ./coverage -name 'coverage.cobertura.xml' | head -1)
          rate=$(grep -oE 'line-rate="[0-9.]+"' "$file" | head -1 | grep -oE '[0-9.]+')
          pct=$(awk "BEGIN{printf \"%.2f\", ${rate}*100}")
          echo "Domain+Application line coverage: ${pct}%"
          awk "BEGIN{exit !(${rate} >= 0.90)}" || { echo "::error::coverage ${pct}% is below the 90% bar"; exit 1; }

      # Régénère le registre publié (dist/registry/) : valide chaque manifeste,
      # vérifie que les fichiers déclarés existent (le manifeste ne ment jamais),
      # et échoue si dist/ committé diverge du contenu de registry/.
      - name: Generate registry manifest
        run: dotnet run --project tools/Outlet.Registry.Builder -c Release --no-build

      - name: Verify dist/ is up to date
        run: git diff --exit-code -- dist/registry

  frontend:
    name: Frontend — lint, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
